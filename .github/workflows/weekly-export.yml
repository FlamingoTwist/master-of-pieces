name: Weekly High Scores Export

on:
  schedule:
    # Runs every Friday at 09:00 UTC (9:00 AM UK/UTC)
    - cron: '0 9 * * 5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  export-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Scores and Generate CSV
        run: |
          node scripts/export-scores.js
        env:
          SUPABASE_URL: https://sklanvjgzfrhndlazhcb.supabase.co
          SUPABASE_KEY: sb_publishable_3lAGqD5TwO64zI0OyVSA9Q_kNzoQerE

      - name: Upload CSV as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: High-Scores-Weekly-Export
          path: High Scores Weekly Export.csv
          retention-days: 90

      - name: Commit and Push Updated CSV to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "High Scores Weekly Export.csv"
          if git diff --staged --quiet; then
            echo "No changes in leaderboard scores."
          else
            git commit -m "Automated Weekly High Scores Export [skip ci]"
            git push
          fi
