name: Prune Duplicate High Scores

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview without deleting)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prune-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prune Duplicate Scores
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/prune-duplicates.js --dry-run
          else
            node scripts/prune-duplicates.js
          fi
        env:
          SUPABASE_URL: https://sklanvjgzfrhndlazhcb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Refresh CSV Export
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          node scripts/export-scores.js
        env:
          SUPABASE_URL: https://sklanvjgzfrhndlazhcb.supabase.co
          SUPABASE_KEY: sb_publishable_3lAGqD5TwO64zI0OyVSA9Q_kNzoQerE

      - name: Commit and Push Updated CSV to Repo
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "High Scores Weekly Export.csv"
          if git diff --staged --quiet; then
            echo "CSV already up to date."
          else
            git commit -m "Update High Scores Weekly Export.csv after duplicate prune [skip ci]"
            git push
          fi
