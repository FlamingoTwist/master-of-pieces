name: Deploy to Itch.io

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.csv'
      - '**.md'
      - '.github/workflows/weekly-export.yml'
      - '.github/workflows/prune-duplicate-scores.yml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  deploy-html5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package The Master Of Pieces.zip
        run: |
          zip "The Master Of Pieces.zip" index.html

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v2

      - name: Deploy to Itch.io HTML5
        run: |
          butler push "The Master Of Pieces.zip" FlamingoTwist/the-master-of-pieces:html5
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY || secrets.BUTLER_API_KEY }}

  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & sync Capacitor
        run: |
          npm ci
          mkdir -p www
          cp index.html www/index.html
          npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "The Master Of Pieces.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The Master Of Pieces - Android APK
          path: The Master Of Pieces.apk

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v2

      - name: Deploy APK to Itch.io Android Channel
        run: |
          butler push "The Master Of Pieces.apk" FlamingoTwist/the-master-of-pieces:android
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY || secrets.BUTLER_API_KEY }}
