name: Deploy to Itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package The Master Of Pieces.zip
        run: |
          zip "The Master Of Pieces.zip" index.html

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v2

      - name: Deploy to Itch.io
        run: |
          butler push "The Master Of Pieces.zip" FlamingoTwist/the-master-of-pieces:html5
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY || secrets.BUTLER_API_KEY }}
